[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simlab"
version = "0.1.0"
description = "Simulation-first desktop robotics scene editor MVP."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "SimLab Contributors" }]
dependencies = [
  "numpy>=1.26",
  "mujoco>=3.1",
  "usd-core>=25.5",
  "jsonschema>=4.23",
  "fastapi>=0.115,<0.116",
  "uvicorn>=0.34,<0.35",
  "anyio>=4.4,<4.10",
  "websockets>=14,<16",
]

[project.optional-dependencies]
desktop = [
  "PySide6>=6.7",
]
dev = [
  "PySide6>=6.7",
  "pytest>=8.0",
  "httpx>=0.28",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
simlab = "simlab.app:main"
simlab-web = "simlab.web_server:main"
simlab-api = "simlab.web_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/simlab/schemas" = ["shared/schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
packages = ["simlab"]
ignore_missing_imports = true
check_untyped_defs = true
