syntax = "proto3";

package beefoundrysim.algorithm.v1;

service AlgorithmSimulationBackend {
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc Reset(ResetRequest) returns (StateResponse);
  rpc Step(StepRequest) returns (StateResponse);
  rpc Close(CloseRequest) returns (CloseResponse);
}

message SceneBundle {
  string scene_json = 1;
  string scene_hash = 2;
}

message BodyDescription {
  string id = 1;
}

message JointDescription {
  string id = 1;
  optional double lower = 2;
  optional double upper = 3;
}

message ActuatorDescription {
  string id = 1;
  string joint_id = 2;
  string control_type = 3;
  double lower = 4;
  double upper = 5;
}

message ModelDescription {
  string backend_name = 1;
  string backend_version = 2;
  double timestep = 3;
  string scene_hash = 4;
  string schema_hash = 5;
  repeated BodyDescription bodies = 6;
  repeated JointDescription joints = 7;
  repeated ActuatorDescription actuators = 8;
}

message BackendState {
  string schema_hash = 1;
  double time = 2;
  int64 step_index = 3;
  repeated double joint_positions = 4;
  repeated double joint_velocities = 5;
  repeated double actuator_controls = 6;
  repeated double actuator_forces = 7;
  repeated double body_positions = 8;
  repeated double body_quaternions = 9;
  repeated double body_linear_velocities = 10;
  repeated double body_angular_velocities = 11;
}

message NamedValue {
  string id = 1;
  double value = 2;
}

message ResetOptions {
  repeated NamedValue joint_positions = 1;
  repeated NamedValue joint_velocities = 2;
  repeated NamedValue actuator_controls = 3;
}

message CreateSessionRequest {
  string contract_version = 1;
  SceneBundle bundle = 2;
}

message CreateSessionResponse {
  string session_id = 1;
  ModelDescription description = 2;
}

message ResetRequest {
  string session_id = 1;
  optional int64 seed = 2;
  ResetOptions options = 3;
}

message StepRequest {
  string session_id = 1;
  string schema_hash = 2;
  repeated double controls = 3;
  int32 physics_steps = 4;
}

message StateResponse {
  BackendState state = 1;
}

message CloseRequest {
  string session_id = 1;
}

message CloseResponse {}
